<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | EduBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand d-flex align-items-center gap-2 mb-4" href="dashboard.html"><span class="brand-mark"><i class="fa-solid fa-bridge"></i></span><span class="brand-name">EduBridge</span></a>
      <div class="sidebar-section">Administration</div>
      <a class="sidebar-link active" href="admin.html"><i class="fa-solid fa-shield-halved"></i><span>Admin center</span></a>
      <a class="sidebar-link" href="dashboard.html"><i class="fa-solid fa-grid-2"></i><span>Workspace</span></a>
      <a class="sidebar-link logout-link" href="index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span></a>
    </aside>
    <div class="app-main">
      <header class="app-topbar d-flex justify-content-between align-items-center"><div><div class="small text-muted">Administration</div><h1 class="h4 mb-0 mt-1">Manage EduBridge</h1></div><div id="adminIdentity" class="avatar avatar-blue">AD</div></header>
      <main class="page-content"><div class="container-fluid px-0">
        <div class="row g-4 mb-4">
          <div class="col-lg-4"><section class="surface p-4 mb-4"><h2 class="h5 mb-3">Subjects</h2><form id="subjectForm" class="d-flex gap-2 mb-3"><label class="visually-hidden" for="newSubject">Subject name</label><input id="newSubject" class="form-control" required maxlength="80" placeholder="Add a subject"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-plus"></i></button></form><div id="subjectList" class="d-flex flex-column gap-2"></div></section><section class="surface p-4"><h2 class="h5 mb-3">Departments</h2><form id="departmentForm" class="d-flex gap-2 mb-3"><label class="visually-hidden" for="newDepartment">Department name</label><input id="newDepartment" class="form-control" required maxlength="100" placeholder="Add a department"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-plus"></i></button></form><div id="departmentList" class="d-flex flex-column gap-2"></div></section></div>
          <div class="col-lg-8"><section class="surface p-4 mb-4"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Materials</h2><span id="adminMaterialCount" class="small text-muted"></span></div><div id="adminMaterialList" class="d-flex flex-column gap-2"></div></section><section class="surface p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Users</h2><span id="adminUserCount" class="small text-muted"></span></div><div id="adminUserList" class="d-flex flex-column gap-2"></div></section></div>
        </div>
      </div></main>
    </div>
  </div>
  <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="app.js"></script>
</body>
</html>
